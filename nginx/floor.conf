# À mettre dans le bloc `server` HTTPS de fedoheim.hopto.org (/etc/nginx/sites-available/fedoheim.conf sur la Beemo) :
# floor répond alors sur https://fedoheim.hopto.org/floor/ (le préfixe est retiré avant floor).
location /floor/ {
    proxy_pass http://127.0.0.1:5002/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
